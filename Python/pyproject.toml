[project]
name = "owly"
version = "0.1.0"
description = "Ein Tool, welches die Arbeit mit Ontologien vereinfachen soll und dazu Erklärungen, wie auch Visualisierungen bereitstellt. Außerdem soll es die Erstellung selbiger vereinfachen, durch den Einsatz von LLMs und der Prüfung von daraus entstandenen Ontologien, mithilfe von Python Bibliotheken."
authors = [
    {name = "jstorm123-admin",email = "m778460@hsu-hh.de"}
]
license = {text = "MIT"}
readme = "README.md"
packages = [{include = "owly"}]
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "openai (>=1.95.1,<2.0.0)",
    "rdflib (>=7.1.4,<8.0.0)",
    "pyvis-network (>=0.0.6,<0.0.7)",
    "owlready2 (>=0.48,<0.49)",
    "pyshacl (>=0.30.1,<0.31.0)",
    "owlrl (>=7.1.3,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
